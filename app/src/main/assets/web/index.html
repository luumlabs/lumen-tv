<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tigris</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --label: #000; --secondary: rgba(60,60,67,.6);
    --sep: rgba(60,60,67,.18); --segment: #fff; --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6);
      --sep: rgba(84,84,88,.6); --segment: #636366; --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto; background: var(--bg); color: var(--label); max-width: 720px;
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));
  }
  header { padding: 28px 4px 4px; }
  h1 { font-size: 32px; font-weight: 700; margin: 0; }
  header p { margin: 4px 0 0; color: var(--secondary); font-size: 15px; }
  h2 { font-size: 13px; font-weight: 500; color: var(--secondary); margin: 28px 4px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button, .seg button {
    appearance: none; border: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--label);
    background: var(--card); padding: 9px 14px; border-radius: 20px;
  }
  .chips button[aria-pressed="true"] { background: var(--tint); color: #fff; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button { background: transparent; border-radius: 8px; padding: 9px 0; }
  .seg button[aria-pressed="true"] { background: var(--segment); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .primary {
    display: block; width: 100%; padding: 15px; border: 0; border-radius: 14px;
    background: var(--tint); color: #fff; font: inherit; font-weight: 600; text-align: center;
  }
  .primary[disabled] { opacity: .6; }
  textarea {
    width: 100%; min-height: 110px; padding: 12px; border: 0; border-radius: 12px; resize: vertical;
    background: var(--card); color: var(--label); font: 15px/1.4 ui-monospace, Menlo, monospace;
  }
  .hint { color: var(--secondary); font-size: 13px; margin: 8px 4px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  .ph { position: relative; }
  .ph img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--fill); }
  .ph button {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 15px; line-height: 26px; padding: 0;
  }
  .empty { color: var(--secondary); font-size: 15px; padding: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px;
    opacity: 0; transition: opacity .2s, transform .3s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1>Tigris</h1>
  <p>{{DEVICE}} · 在手机上改，电视上马上生效</p>
</header>

<h2>主屏幕背景</h2>
<div class="chips" id="backgrounds"></div>

<h2>屏保</h2>
<div class="seg" id="saver">
  <button data-mode="photos">照片</button>
  <button data-mode="aerial">Apple TV 航拍</button>
</div>
<p class="hint">航拍视频从 Apple 服务器在线播放（约 15–20 Mbps）；放不出来时自动换回照片。屏保内容跟随上面选的背景来源。</p>

<h2>开机动画</h2>
<div class="seg three" id="intro">
  <button data-mode="off">关</button>
  <button data-mode="boot">开机时</button>
  <button data-mode="wake">开机和唤醒时</button>
</div>
<p style="margin-top:12px"><label class="primary" id="pickIntro">上传动画视频<input type="file" id="introFile" accept="video/*" hidden></label></p>
<p class="hint" id="introHint"></p>
<div class="seg" id="introSource" style="margin-top:12px">
  <button data-source="video">内置 / 上传视频</button>
  <button data-source="wordmark">Tigris 字样</button>
</div>

<h2>设置页背景</h2>
<label class="primary" id="pickBackdrop">上传设置页背景<input type="file" id="backdropFile" accept="image/*" hidden></label>
<p class="hint" id="backdropHint"></p>

<h2 id="avatar">头像</h2>
<label class="primary">上传头像<input type="file" id="avatarFile" accept="image/*" hidden></label>
<p class="hint">图片会居中裁成正方形，显示为桌面右上角的圆形头像；返回桌面后生效。</p>
<p class="hint" id="avatarHint"></p>
<h2>设置图标</h2>
<label class="primary" id="pickIcon">上传设置图标<input type="file" id="iconFile" accept="image/*" hidden></label>
<p class="hint" id="iconHint"></p>

<h2>我的照片</h2>
<label class="primary" id="pick">选择照片上传<input type="file" id="file" accept="image/*" multiple hidden></label>
<p class="hint">上传后背景会切到“我的照片”。电视会把照片缩到 1920×1080 保存。</p>
<div class="grid" id="mine"></div>

<h2>自定义图片链接</h2>
<textarea id="links" placeholder="每行一个链接，例如&#10;https://example.com/wallpaper.jpg&#10;https://某个随机图接口/api"></textarea>
<p class="hint">可以是一张图片的地址、每次打开都给一张新图的随机图接口，或者列出图片地址的网页 / JSON。电视每天自动去取一次，每个链接最多存几张。</p>
<p style="margin-top:12px"><button class="primary" id="save">保存并开始获取</button></p>
<div class="grid" id="custom"></div>

<div class="toast" id="toast"></div>

<script>
const base = location.pathname.replace(/\/?$/, '/');
let state = null;
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}

async function post(path, data) {
  const r = await fetch(base + path, { method: 'POST', body: new URLSearchParams(data) });
  if (!r.ok) throw new Error(await r.text());
  render(await r.json());
}

function photos(el, source, names) {
  el.innerHTML = '';
  if (!names.length) { el.innerHTML = '<div class="empty">还没有</div>'; return; }
  for (const n of names) {
    const d = document.createElement('div'); d.className = 'ph';
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = base + 'thumb/' + source + '/' + n;
    const b = document.createElement('button'); b.textContent = '✕'; b.title = '删除';
    b.onclick = () => post('api/delete', { source, id: n }).then(() => toast('已删除'));
    d.append(img, b); el.append(d);
  }
}

function render(s) {
  state = s;
  const bg = $('backgrounds'); bg.innerHTML = '';
  for (const o of [...s.sources, ...s.themes]) {
    const b = document.createElement('button'); b.textContent = o.label;
    b.setAttribute('aria-pressed', s.background === o.id);
    b.onclick = () => post('api/background', { id: o.id }).then(() => toast('已换成 ' + o.label));
    bg.append(b);
  }
  document.querySelectorAll('#saver button').forEach(b => {
    b.setAttribute('aria-pressed', s.screensaver === b.dataset.mode);
    b.onclick = () => post('api/screensaver', { mode: b.dataset.mode }).then(() => toast('屏保：' + b.textContent));
  });
  document.querySelectorAll('#intro button').forEach(b => {
    b.setAttribute('aria-pressed', s.intro === b.dataset.mode);
    b.onclick = () => post('api/intro', { mode: b.dataset.mode }).then(() => toast('开机动画：' + b.textContent));
  });
  document.querySelectorAll('#introSource button').forEach(b => {
    b.setAttribute('aria-pressed', s.introSource === b.dataset.source);
    b.onclick = () => post('api/intro/source', { source: b.dataset.source }).then(() => toast('动画内容：' + b.textContent));
  });
  if (s.backdrop) {
    $('backdropHint').innerHTML = '设置页正在用这张图，电视上可以在设置里切换成普通背景。<a href="#" id="backdropDel">删除这张图</a>';
    $('backdropDel').onclick = e => { e.preventDefault(); post('api/backdrop/delete', {}).then(() => toast('已删除')); };
  } else {
    $('backdropHint').textContent = '当前使用内置背景。可上传整个设置页的背景，16:9 横图；图左边放主体（比如一台电视），右边留给设置项。';
  }
  $('avatarHint').textContent = s.avatar ? '已使用自定义头像。' : '正在使用默认头像。';
  if (s.avatar) {
    const reset = document.createElement('button'); reset.textContent = '恢复默认头像';
    reset.onclick = () => post('api/avatar/delete', {}).then(() => toast('已恢复默认头像'));
    $('avatarHint').appendChild(reset);
  }
  if (s.icon) {
    $('iconHint').innerHTML = '主屏幕和设置页正在用这张图。<a href="#" id="iconDel">换回默认齿轮</a>';
    $('iconDel').onclick = e => { e.preventDefault(); post('api/icon/delete', {}).then(() => toast('已换回默认图标')); };
  } else {
    $('iconHint').textContent = '主屏幕上「主屏幕设置」的图标和设置页左边的大图，最好是 16:9 的横图。';
  }
  const hint = $('introHint');
  if (s.introVideo) {
    hint.innerHTML = '已上传（' + (s.introVideo / 1048576).toFixed(1) + ' MB）。<a href="#" id="introDel">删除</a>';
    $('introDel').onclick = e => { e.preventDefault(); post('api/intro/delete', {}).then(() => toast('已删除动画视频')); };
  } else {
    hint.textContent = '最好是结尾停在黑底标志上的短视频：标志会放大，带你进入主屏幕。没有上传视频时使用内置开机动画。';
  }
  if (document.activeElement !== $('links')) $('links').value = s.links;
  photos($('mine'), 'mine', s.mine);
  photos($('custom'), 'custom', s.custom);
}

$('file').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const pick = $('pick'); pick.firstChild.textContent = '正在上传 ' + files.length + ' 张…';
  try {
    const fd = new FormData();
    files.forEach((f, i) => fd.append('photo' + (i || ''), f, f.name));
    const r = await fetch(base + 'api/upload', { method: 'POST', body: fd });
    const s = await r.json(); render(s);
    toast(s.added ? '已上传 ' + s.added + ' 张' : '没有可用的图片');
  } catch (err) { toast('上传失败：' + err.message); }
  pick.firstChild.textContent = '选择照片上传'; e.target.value = '';
};

$('introFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const pick = $('pickIntro'); pick.firstChild.textContent = '正在上传…';
  try {
    const fd = new FormData(); fd.append('video', f, f.name);
    const r = await fetch(base + 'api/intro/upload', { method: 'POST', body: fd });
    const s = await r.json(); render(s);
    toast(s.ok ? '已上传，可以在电视的设置里预览' : '电视播放不了这个文件');
  } catch (err) { toast('上传失败：' + err.message); }
  pick.firstChild.textContent = '上传动画视频'; e.target.value = '';
};

$('backdropFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const fd = new FormData(); fd.append('backdrop', f, f.name);
    const s = await (await fetch(base + 'api/backdrop/upload', { method: 'POST', body: fd })).json(); render(s);
    toast(s.ok ? '已换上，打开设置就能看到' : '不是可用的图片');
  } catch (err) { toast('上传失败：' + err.message); }
  e.target.value = '';
};

$('iconFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const fd = new FormData(); fd.append('icon', f, f.name);
    const s = await (await fetch(base + 'api/icon/upload', { method: 'POST', body: fd })).json(); render(s);
    toast(s.ok ? '已换上，回到主屏幕就能看到' : '不是可用的图片');
  } catch (err) { toast('上传失败：' + err.message); }
  e.target.value = '';
};

$('avatarFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const fd = new FormData(); fd.append('avatar', f, f.name);
    const s = await (await fetch(base + 'api/avatar/upload', { method: 'POST', body: fd })).json(); render(s);
    toast(s.ok ? '已换上，回到主屏幕就能看到' : '不是可用的图片');
  } catch (err) { toast('上传失败：' + err.message); }
  e.target.value = '';
};

$('save').onclick = async () => {
  await post('api/links', { links: $('links').value });
  toast(state.links ? '已保存，电视正在获取图片' : '已清空');
  // Pictures arrive over the next half minute or so.
  let n = 0; const t = setInterval(async () => {
    if (++n > 10) return clearInterval(t);
    render(await (await fetch(base + 'api/state')).json());
  }, 4000);
};

fetch(base + 'api/state').then(r => r.json()).then(render).catch(() => toast('连不上电视，请重新扫码'));
</script>
</body>
</html>
