name: "📺 TV compatibility report / Informe de compatibilidad"
description: "Report how Lumen TV installs and runs on a real TV / Cuenta cómo se instala y funciona Lumen TV en un televisor real"
title: "[TV] Brand Model"
body:
  - type: markdown
    attributes:
      value: |
        Please report what you actually observed on your TV, not what you expect from the brand.
        **A successful install does not mean every feature works.** Reports are added to the README
        as *self-reported*, through a pull request a maintainer reviews.

        Describe lo que observaste en tu televisor. **Que se instale no significa que todo funcione.**
        Los informes se añaden al README como *no verificados*, mediante un pull request revisado.
  - type: input
    id: brand
    attributes:
      label: "Brand / Marca"
      placeholder: "Sony, TCL, Xiaomi, Hisense, Philips…"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "Model / Modelo"
      placeholder: "XR-55A80J, 55C745, MiTV-ANSP0…"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: "Android version / Versión de Android"
      description: "Include the API level if you know it / Incluye el nivel de API si lo conoces"
      placeholder: "Android 11 (API 30)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Lumen version / Versión de Lumen"
      placeholder: "v3.4.0"
    validations:
      required: true
  - type: dropdown
    id: apk
    attributes:
      label: "APK type / Tipo de APK"
      options:
        - "Standard / Estándar"
        - "Guard / Guard"
        - "Custom fork / Fork propio"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: "Installation result / Resultado de la instalación"
      options:
        - "Installed and launches / Instalado y se abre"
        - "Installed but crashes / Instalado pero se cierra"
        - "Installation rejected / Instalación rechazada"
        - "Not tested / Sin probar"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Observations, feature tests and logs / Observaciones, pruebas y registros"
      description: "HDMI inputs, Back and Home keys, default home, brightness, volume, error messages / Entradas HDMI, teclas Atrás e Inicio, pantalla de inicio por defecto, brillo, volumen, errores"
      placeholder: "What you did and what happened / Qué hiciste y qué pasó"
    validations:
      required: true
