<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="航拍屏保的动态示意插图，非实拍">
  <title>Apple TV 航拍屏保 · 动态示意（非实拍）</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101f"/>
      <stop offset="0.38" stop-color="#0a2038"/>
      <stop offset="0.62" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0a1624"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2136"/>
      <stop offset="0.55" stop-color="#08192a"/>
      <stop offset="1" stop-color="#04101c"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3852"/>
      <stop offset="1" stop-color="#152a3e"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2235"/>
      <stop offset="1" stop-color="#0a1826"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d16"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee9a8" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#3df0b4" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#5ce6d8" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#7f8bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f8bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7dff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7f8bff" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#b98bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b98bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd7a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- horizon light -->
  <ellipse cx="640" cy="392" rx="620" ry="120" fill="url(#sunGlow)" opacity="0.5" filter="url(#soft)"/>

  <!-- aurora ribbons -->
  <g filter="url(#soft2)" opacity="0.9">
    <path d="M-40 214 C 180 96, 430 262, 700 150 S 1120 74, 1330 168" stroke="url(#aurora1)" stroke-width="54" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M-60 268 C 210 150, 470 300, 760 196 S 1150 128, 1340 212" stroke="url(#aurora2)" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 336 C 260 244, 520 350, 800 268 S 1130 210, 1300 276" stroke="url(#aurora1)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- stars -->
  <g fill="#eaf3ff">
    <circle cx="128" cy="86" r="1.6" opacity="0.8"/>
    <circle cx="286" cy="132" r="1.2" opacity="0.6"/>
    <circle cx="418" cy="72" r="1.8" opacity="0.75"/>
    <circle cx="612" cy="118" r="1.1" opacity="0.5"/>
    <circle cx="742" cy="64" r="1.5" opacity="0.7"/>
    <circle cx="902" cy="116" r="1.2" opacity="0.55"/>
    <circle cx="1046" cy="78" r="1.7" opacity="0.75"/>
    <circle cx="1188" cy="136" r="1.2" opacity="0.5"/>
    <circle cx="196" cy="196" r="1" opacity="0.4"/>
    <circle cx="980" cy="188" r="1" opacity="0.4"/>
  </g>

  <!-- far ridge -->
  <path d="M0 402 L96 372 L182 396 L268 350 L360 388 L462 344 L556 382 L650 352 L748 390 L846 356 L944 392 L1044 358 L1140 394 L1226 366 L1280 388 L1280 470 L0 470 Z" fill="url(#ridgeFar)"/>
  <!-- mid ridge -->
  <path d="M0 452 L88 424 L176 448 L272 410 L372 446 L470 406 L566 444 L664 412 L762 448 L858 414 L956 450 L1058 416 L1152 450 L1240 422 L1280 442 L1280 520 L0 520 Z" fill="url(#ridgeMid)"/>

  <!-- water -->
  <rect x="0" y="470" width="1280" height="250" fill="url(#water)"/>
  <!-- water light streaks -->
  <g opacity="0.5">
    <rect x="392" y="486" width="300" height="2.5" rx="1.25" fill="#7fb6ff" opacity="0.55"/>
    <rect x="470" y="504" width="200" height="2" rx="1" fill="#8fd8ff" opacity="0.4"/>
    <rect x="356" y="524" width="380" height="2" rx="1" fill="#6aa8f0" opacity="0.3"/>
    <rect x="512" y="548" width="260" height="2" rx="1" fill="#5e93d8" opacity="0.22"/>
    <rect x="420" y="580" width="330" height="2" rx="1" fill="#4d7fbe" opacity="0.16"/>
  </g>

  <!-- near coast foreground -->
  <path d="M0 596 L110 566 L206 592 L302 560 L404 594 L500 566 L592 600 L700 574 L800 602 L906 576 L1006 604 L1112 580 L1218 606 L1280 590 L1280 720 L0 720 Z" fill="url(#ridgeNear)"/>
  <path d="M0 650 L140 630 L268 654 L400 632 L528 656 L660 634 L790 658 L920 636 L1050 660 L1180 640 L1280 656 L1280 720 L0 720 Z" fill="#01050a"/>

  <!-- tiny coastal lights -->
  <g fill="#ffd9a0" opacity="0.85">
    <circle cx="176" cy="612" r="1.8"/>
    <circle cx="238" cy="606" r="1.4"/>
    <circle cx="452" cy="610" r="1.6"/>
    <circle cx="516" cy="618" r="1.3"/>
    <circle cx="846" cy="614" r="1.7"/>
    <circle cx="906" cy="608" r="1.2"/>
    <circle cx="1104" cy="616" r="1.5"/>
  </g>

  <rect width="1280" height="720" fill="url(#vignette)"/>
</svg>
